<!DOCTYPE html>
<html lang="ja">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Paddy Filder's Tea Party</title>
<meta name="description" content="早稲田大学公認 国際交流サークル Paddy。毎週火・金 17:00、学生会館で。">
<meta name="theme-color" content="#6EC1F7">
<link rel="icon" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Serif:ital@1&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: one short mobile scroll. Sticky bar with social icons → giant mixed-type
   wordmark (flayks) → one-line mission + 3 one-liners (npca) → big numbers → join. */
:root {
  --sky: #6EC1F7;
  --sky-deep: #1878C4;
  --ink: #0C2A44;
  --bg: #F3FAFF;
  --card: #FFFFFF;
  --line: #CFE7F8;
  --muted: #557189;
  --sun: #FFB845;
  --bar: rgba(255, 255, 255, 0.88);
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-accent: "Instrument Serif", Georgia, serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #0F5A96; --sky-deep: #8CD2FF; --ink: #E6F3FD; --bg: #071827; --card: #0E2236;
    --line: #1D3D5B; --muted: #9AB7CF; --sun: #FFC15E; --bar: rgba(7, 24, 39, 0.88); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #0F5A96; --sky-deep: #8CD2FF; --ink: #E6F3FD; --bg: #071827; --card: #0E2236;
  --line: #1D3D5B; --muted: #9AB7CF; --sun: #FFC15E; --bar: rgba(7, 24, 39, 0.88); color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bar); }
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, p { margin: 0; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bar); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 8px; }
.mark { width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(24, 120, 196, 0.2); flex: none; }
.mark img { width: 24px; }
.icons { display: flex; gap: 8px; align-items: center; }
.ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #FFFFFF; text-decoration: none; transition: transform 0.15s; }
.ic:active { transform: scale(0.9); }
.ic svg { width: 22px; height: 22px; }
.ig { background: radial-gradient(circle at 30% 107%, #FDD86A 0%, #FA8E3C 30%, #E3346F 60%, #A13CC2 100%); }
.ln { background: #06C755; }
.li { background: #0A66C2; }
.lang { height: 44px; min-width: 44px; padding: 0 10px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: 700 13px var(--font-body); letter-spacing: 0.06em; cursor: pointer; }

/* hero */
.hero { background: var(--sky); color: #FFFFFF; overflow: hidden; }
.hero .wrap { padding-block: 28px 36px; display: grid; gap: 22px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 4px rgba(255, 184, 69, 0.35); flex: none; }
.word { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: clamp(72px, 23vw, 210px); line-height: 0.8; white-space: nowrap; letter-spacing: -0.01em; margin-left: -3px; }
.word i { font-family: var(--font-accent); font-style: italic; font-weight: 400; text-transform: none; letter-spacing: 0; }
.word .chip { display: inline-block; vertical-align: middle; width: 0.62em; height: 0.62em; border-radius: 0.16em; background: #FFFFFF; margin: 0 0.04em 0.12em; position: relative; }
.word .chip img { position: absolute; inset: 18%; width: 64%; height: 64%; object-fit: contain; }
.sub { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: 0.06em; }
.cta { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 16px; background: var(--sun); color: #3A2400; font: 900 17px var(--font-body); text-decoration: none; }
.cta svg { width: 22px; height: 22px; }

/* mission */
section .wrap { padding-block: 44px 0; display: grid; gap: 18px; }
.eyebrow { font-family: var(--font-display); font-weight: 900; font-size: 14px; letter-spacing: 0.16em; color: var(--sky-deep); }
.mission { font-weight: 900; font-size: clamp(30px, 9vw, 52px); line-height: 1.25; }
.do { list-style: none; margin: 0; padding: 0; display: grid; }
.do li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 0; border-top: 1px solid var(--line); font-weight: 900; font-size: 20px; }
.do li:last-child { border-bottom: 1px solid var(--line); }
.do span { font-family: var(--font-accent); font-style: italic; font-weight: 400; font-size: 22px; color: var(--sky-deep); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1.5px solid var(--line); }

/* numbers */
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.num { min-width: 0; }
.num b { display: block; font-family: var(--font-display); font-weight: 900; font-size: clamp(44px, 14vw, 80px); line-height: 0.9; color: var(--sky-deep); font-variant-numeric: tabular-nums; }
.num small { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }

/* join */
.join { margin-top: 48px; background: var(--sky); color: #FFFFFF; }
.join .wrap { padding-block: 40px; display: grid; gap: 18px; }
.join h2 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: clamp(56px, 18vw, 120px); line-height: 0.85; }
.join h2 i { font-family: var(--font-accent); font-weight: 400; text-transform: none; }
.where { font-weight: 700; font-size: 15px; }
.follow { display: flex; gap: 10px; }
.follow .ic { width: 52px; height: 52px; }
footer .wrap { padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); text-align: center; }

@media (min-width: 720px) {
  .cta { justify-self: start; padding: 0 28px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>

<script>
(function () {
  var dict = {
    status: ['毎週 火・金 17:00 / 学生会館', 'Tue & Fri 17:00 / Student Center'],
    join: ['LINEで参加する', 'Join via LINE'],
    eyebrow: ['早稲田大学公認 国際交流サークル', 'Waseda official international circle'],
    mission: ['世界中に、友達を。', 'Friends from all over the world.'],
    do1: ['英語で話す', 'Speak English'],
    do2: ['文化を知る', 'Discover cultures'],
    do3: ['友達ができる', 'Make friends'],
    tag1: ['英語が苦手でもOK', 'Any English level'],
    tag2: ['1人参加OK', 'Come alone'],
    tag3: ['他大学歓迎', 'All universities'],
    n1: ['メンバー', 'members'],
    n2: ['毎週の活動', 'meetups / week'],
    n3: ['入会費', 'joining fee'],
    where: ['火・金 17:00–18:30 / 早稲田大学 学生会館', 'Tue & Fri 17:00–18:30 / Waseda Student Center']
  };
  var root = document.documentElement, t = document.getElementById('langToggle'), lang = 'ja';
  try { lang = localStorage.getItem('paddy-lang') || 'ja'; } catch (e) {}
  function apply(n) {
    lang = n; root.lang = n; t.textContent = n === 'ja' ? 'EN' : 'JP';
    var i = n === 'ja' ? 0 : 1;
    document.querySelectorAll('[data-i18n]').forEach(function (el) { var v = dict[el.getAttribute('data-i18n')]; if (v) el.textContent = v[i]; });
    try { localStorage.setItem('paddy-lang', n); } catch (e) {}
  }
  t.addEventListener('click', function () { apply(lang === 'ja' ? 'en' : 'ja'); });
  apply(lang);
})();
</script>
